openapi: 3.1.0
info:
  title: 企业内部练习与考试系统 API
  version: 1.0.0
  description: |
    MVP 完整接口规格。全局约定见 [00-API设计说明.md](./00-API设计说明.md)。
    分域行为见 01~07 Markdown 文档。
  contact:
    name: Exam System Team

servers:
  - url: /api/v1
    description: 单租户企业内网 API

tags:
  - name: Auth
    description: 认证与会话（FR-AUTH, SYS-01）
  - name: Organization
    description: 组织与员工（FR-AUTH-04~05）
  - name: QuestionBank
    description: 题库与题目（FR-QST, SYS-02）
  - name: Import
    description: Excel 导题（FR-IMP, SYS-02）
  - name: Practice
    description: 日常练习（FR-PRA）
  - name: MockExam
    description: 模拟考试（FR-SIM, SYS-04）
  - name: Exam
    description: 正式考试配置（FR-EXM, SYS-03）
  - name: Attempt
    description: 考试尝试与开卷（FR-ATT, SYS-03）
  - name: Answer
    description: 作答保存与交卷（FR-ANS, SYS-04）
  - name: Score
    description: 评分与结果（FR-SCR, SYS-04）
  - name: Report
    description: 统计与导出（FR-REP, SYS-06）
  - name: Outage
    description: 平台故障（FR-OPS, SYS-05）
  - name: Audit
    description: 审计日志（FR-OPS-03, SYS-07）

security:
  - sessionAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: 工号密码登录
      security: []
      x-fr-ids: [FR-AUTH-01]
      x-page-ids: [MP-01, EX-01, AD-01]
      x-sys-ids: [SYS-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: 注销会话
      x-fr-ids: [FR-AUTH-01]
      responses:
        '204':
          description: 已注销

  /auth/session:
    get:
      tags: [Auth]
      operationId: authGetSession
      summary: 查询当前会话
      x-fr-ids: [FR-AUTH-01, FR-AUTH-06]
      responses:
        '200':
          description: 会话有效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: authChangePassword
      summary: 修改密码
      x-fr-ids: [FR-AUTH-02]
      x-page-ids: [MP-01, EX-01, AD-01, MP-12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /auth/sms/send:
    post:
      tags: [Auth]
      operationId: authSendSms
      summary: 发送短信验证码
      security: []
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [EX-01, MP-12, AD-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/sms/verify:
    post:
      tags: [Auth]
      operationId: authVerifySms
      summary: 校验短信验证码
      security: []
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [EX-01, MP-12, AD-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          verificationToken:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time

  /auth/mini-program/bind:
    post:
      tags: [Auth]
      operationId: authBindMiniProgram
      summary: 小程序身份绑定
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [MP-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, miniProgramOpenId]
              properties:
                verificationToken:
                  type: string
                miniProgramOpenId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /auth/mini-program/unbind:
    post:
      tags: [Auth]
      operationId: authUnbindMiniProgram
      summary: 小程序身份解绑（需短信验证令牌）
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [MP-01, MP-12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken]
              properties:
                verificationToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /auth/mini-program/openid:
    post:
      tags: [Auth]
      operationId: authResolveMiniProgramOpenId
      summary: 用 wx.login code 换 openId（开发环境 mock）
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [MP-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: openId
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      openId:
                        type: string

  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: authPasswordReset
      summary: 短信验证后重置密码
      security: []
      x-fr-ids: [FR-AUTH-03]
      x-page-ids: [EX-01, MP-12, AD-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNo, verificationToken, newPassword]
              properties:
                employeeNo:
                  type: string
                verificationToken:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /departments:
    get:
      tags: [Organization]
      operationId: listDepartments
      summary: 部门列表/树
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-02]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [tree, flat]
            default: tree
      responses:
        '200':
          description: 部门数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Department'
    post:
      tags: [Organization]
      operationId: createDepartment
      summary: 创建部门
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentId]
              properties:
                name:
                  type: string
                parentId:
                  type: string
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Department'

  /departments/{id}:
    patch:
      tags: [Organization]
      operationId: updateDepartment
      summary: 更新部门（改名/移动/停用）
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-02]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                parentId:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /employees:
    get:
      tags: [Organization]
      operationId: listEmployees
      summary: 员工分页列表
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-03]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: departmentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 分页员工
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedEmployees'
    post:
      tags: [Organization]
      operationId: createEmployee
      summary: 手工建档
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: 含一次性临时密码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateEmployeeResponse'

  /employees/import:
    post:
      tags: [Organization]
      operationId: importEmployees
      summary: Excel 批量导入员工
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-03]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /employees/{id}:
    get:
      tags: [Organization]
      operationId: getEmployee
      summary: 员工详情
      x-fr-ids: [FR-AUTH-04]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    patch:
      tags: [Organization]
      operationId: updateEmployee
      summary: 更新员工
      x-fr-ids: [FR-AUTH-04]
      x-page-ids: [AD-03, AD-04]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                departmentPath:
                  type: string
                phone:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /employees/{id}/reset-password:
    post:
      tags: [Organization]
      operationId: resetEmployeePassword
      summary: 重置员工密码
      x-fr-ids: [FR-AUTH-02]
      x-page-ids: [AD-04]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 含一次性临时密码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          temporaryPassword:
                            type: string

  /employees/credential-batches/{id}/download:
    get:
      tags: [Organization]
      operationId: downloadCredentialBatch
      summary: 下载批量初始凭据（仅一次）
      x-fr-ids: [FR-AUTH-02]
      x-page-ids: [AD-03]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 凭据文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /employees/{id}/admin-grants:
    patch:
      tags: [Organization]
      operationId: updateAdminGrants
      summary: 管理员与异常处置授权
      x-fr-ids: [FR-AUTH-05]
      x-page-ids: [AD-04]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                isAdmin:
                  type: boolean
                hasOutageDisposition:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /question-banks:
    get:
      tags: [QuestionBank]
      operationId: listQuestionBanks
      summary: 题库列表
      x-fr-ids: [FR-QST-01]
      x-page-ids: [AD-05]
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [QuestionBank]
      operationId: createQuestionBank
      summary: 创建题库
      x-fr-ids: [FR-QST-01]
      x-page-ids: [AD-05]
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /question-banks/{id}:
    patch:
      tags: [QuestionBank]
      operationId: updateQuestionBank
      summary: 更新题库与开放策略
      x-fr-ids: [FR-QST-01]
      x-page-ids: [AD-05]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /question-banks/{bankId}/categories:
    get:
      tags: [QuestionBank]
      operationId: listCategories
      summary: 分类列表
      x-fr-ids: [FR-QST-02]
      x-page-ids: [AD-06]
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [QuestionBank]
      operationId: createCategory
      summary: 创建分类
      x-fr-ids: [FR-QST-02]
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /categories/{id}:
    patch:
      tags: [QuestionBank]
      operationId: updateCategory
      summary: 更新分类
      x-fr-ids: [FR-QST-02]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /categories/{categoryId}/knowledge-points:
    get:
      tags: [QuestionBank]
      operationId: listKnowledgePoints
      summary: 知识点列表
      x-fr-ids: [FR-QST-02]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [QuestionBank]
      operationId: createKnowledgePoint
      summary: 创建知识点
      x-fr-ids: [FR-QST-02]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /knowledge-points/{id}:
    patch:
      tags: [QuestionBank]
      operationId: updateKnowledgePoint
      summary: 更新知识点
      x-fr-ids: [FR-QST-02]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /question-banks/{bankId}/questions:
    get:
      tags: [QuestionBank]
      operationId: listQuestions
      summary: 题目列表
      x-fr-ids: [FR-QST-03]
      x-page-ids: [AD-06]
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [QuestionBank]
      operationId: createQuestion
      summary: 创建题目
      x-fr-ids: [FR-QST-03, FR-QST-04]
      x-page-ids: [AD-07]
      parameters:
        - name: bankId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /questions/{id}:
    get:
      tags: [QuestionBank]
      operationId: getQuestion
      summary: 题目详情
      x-fr-ids: [FR-QST-03]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    patch:
      tags: [QuestionBank]
      operationId: updateQuestion
      summary: 更新题目元数据（不含内容版本）
      x-fr-ids: [FR-QST-03]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /questions/{id}/copy:
    post:
      tags: [QuestionBank]
      operationId: copyQuestion
      summary: 复制为新题（独立逻辑题目；不停用原题）
      x-fr-ids: [FR-QST-03]
      x-page-ids: [AD-07]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetBankId, categoryId]
              properties:
                targetBankId:
                  type: string
                categoryId:
                  type: string
                knowledgePointId:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /questions/{id}/versions:
    get:
      tags: [QuestionBank]
      operationId: listQuestionVersions
      summary: 题目版本历史
      x-fr-ids: [FR-QST-03]
      x-page-ids: [AD-07]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [QuestionBank]
      operationId: createQuestionVersion
      summary: 创建不可变新版本
      x-fr-ids: [FR-QST-03, FR-QST-04]
      x-page-ids: [AD-07]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionVersionInput'
      responses:
        '201':
          description: 新版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuestionVersionAdmin'

  /question-versions/{versionId}:
    get:
      tags: [QuestionBank]
      operationId: getQuestionVersion
      summary: 题目版本详情
      x-fr-ids: [FR-QST-03]
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /import/template:
    get:
      tags: [Import]
      operationId: downloadImportTemplate
      summary: 下载导题模板
      x-fr-ids: [FR-IMP-01]
      x-page-ids: [AD-08]
      parameters:
        - name: questionBankId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: xlsx 模板
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /import/tasks:
    get:
      tags: [Import]
      operationId: listImportTasks
      summary: 导题任务列表
      x-fr-ids: [FR-IMP-05]
      x-page-ids: [AD-08]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: questionBankId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'
    post:
      tags: [Import]
      operationId: createImportTask
      summary: 上传 Excel 创建导题任务
      x-fr-ids: [FR-IMP-01, FR-IMP-02]
      x-page-ids: [AD-08]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, questionBankId]
              properties:
                file:
                  type: string
                  format: binary
                questionBankId:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/SuccessEmpty'

  /import/tasks/{id}:
    get:
      tags: [Import]
      operationId: getImportTask
      summary: 导题任务详情
      x-fr-ids: [FR-IMP-05]
      x-page-ids: [AD-08, AD-09]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          $ref: '#/components/responses/SuccessEmpty'

  /import/tasks/{id}/preview:
    get:
      tags: [Import]
      operationId: getImportPreview
      summary: 校验预览
      x-fr-ids: [FR-IMP-03]
      x-page-ids: [AD-09]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: 预览与 confirmToken
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportPreview'

  /import/tasks/{id}/confirm:
    post:
      tags: [Import]
      operationId: confirmImportTask
      summary: 幂等确认导入
      x-fr-ids: [FR-IMP-04]
      x-page-ids: [AD-09]
      x-sys-ids: [SYS-02]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
