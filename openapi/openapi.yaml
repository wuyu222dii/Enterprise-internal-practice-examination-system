components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 亦可用 HttpOnly Session Cookie，二者等价

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 幂等键，见 00-API设计说明

  responses:
    SuccessEmpty:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 无权限或账号受限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 版本或状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 业务规则拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ApiEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      required: [serverNow, requestId, timezone]
      properties:
        serverNow:
          type: string
          format: date-time
        requestId:
          type: string
        timezone:
          type: string
          description: 企业展示时区（CMP-01），例如 Asia/Shanghai

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_ACCOUNT_DISABLED
        - AUTH_SESSION_EXPIRED
        - AUTH_PASSWORD_CHANGE_REQUIRED
        - AUTH_SMS_RATE_LIMITED
        - ORG_DEPARTMENT_NAME_DUPLICATE
        - ORG_LAST_OUTAGE_ADMIN
        - IMP_PREVIEW_STALE
        - PRA_SESSION_ALREADY_ACTIVE
        - SIM_ATTEMPT_ALREADY_ACTIVE
        - ATT_NO_REMAINING_OPPORTUNITY
        - ATT_EXAM_PAUSED
        - ATT_NOT_STARTED
        - ATT_WINDOW_CLOSED
        - ATT_NOT_ASSIGNED
        - ANS_VERSION_CONFLICT
        - ANS_UNCONFIRMED_ANSWERS
        - ANS_ATTEMPT_TERMINATED
        - ANS_IN_OBSERVATION
        - SCR_SUBMIT_IN_PROGRESS
        - OPS_PROPOSAL_STALE
        - OPS_NOT_AUTHORIZED
        - SEC_FORBIDDEN

    ClientType:
      type: string
      enum: [miniProgram, examWeb, adminWeb]

    LoginRequest:
      type: object
      required: [employeeNo, password, clientType]
      properties:
        employeeNo:
          type: string
        password:
          type: string
          format: password
        clientType:
          $ref: '#/components/schemas/ClientType'

    Session:
      type: object
      properties:
        employeeId:
          type: string
        employeeNo:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        isAdmin:
          type: boolean
        hasOutageDisposition:
          type: boolean
        mustChangePassword:
          type: boolean
        miniProgramBound:
          type: boolean
        phoneMasked:
          type: [string, 'null']

    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                session:
                  $ref: '#/components/schemas/Session'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          format: password

    SmsSendRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone:
          type: string
        purpose:
          type: string
          enum: [bindMiniProgram, resetPassword, unbindPhone, unbindMiniProgram]

    SmsVerifyRequest:
      type: object
      required: [phone, code, purpose]
      properties:
        phone:
          type: string
        code:
          type: string
        purpose:
          type: string

    Department:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: [string, 'null']
        path:
          type: string
        status:
          type: string
          enum: [active, disabled]
        employeeCount:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    EmployeeSummary:
      type: object
      properties:
        id:
          type: string
        employeeNo:
          type: string
        displayName:
          type: string
        departmentPath:
          type: string
        phoneMasked:
          type: string
        status:
          type: string
          enum: [active, disabled]
        isAdmin:
          type: boolean
        hasOutageDisposition:
          type: boolean

    PagedEmployees:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CreateEmployeeRequest:
      type: object
      required: [employeeNo, displayName, departmentPath]
      properties:
        employeeNo:
          type: string
        displayName:
          type: string
        departmentPath:
          type: string
        phone:
          type: string

    CreateEmployeeResponse:
      type: object
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeSummary'
        temporaryPassword:
          type: string
          description: 仅本次响应返回一次

    QuestionType:
      type: string
      enum: [singleChoice, multipleChoice, trueFalse, essay]
      description: essay 为解答题，无选项；standardAnswer 存参考答案文本

    QuestionVersionInput:
      type: object
      required: [type, stem, standardAnswer]
      properties:
        type:
          $ref: '#/components/schemas/QuestionType'
        stem:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              text:
                type: string
        standardAnswer:
          type: array
          items:
            type: string
        explanation:
          type: string
        categoryId:
          type: string
        knowledgePointId:
          type: [string, 'null']
        difficulty:
          type: string
          enum: [easy, medium, hard]
        defaultScore:
          type: number
          format: double

    QuestionVersionAdmin:
      allOf:
        - $ref: '#/components/schemas/QuestionVersionInput'
        - type: object
          properties:
            id:
              type: string
            questionId:
              type: string
            versionNo:
              type: integer
            status:
              type: string
              enum: [active, disabled]
            createdAt:
              type: string
              format: date-time

    ImportPreview:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
        confirmToken:
          type: string
        importableCount:
          type: integer
        errorCount:
          type: integer
        pendingHierarchy:
          type: object
        previewExpiresAt:
          type: string
          format: date-time

    CreatePracticeSessionRequest:
      type: object
      required: [questionBankId, mode]
      properties:
        questionBankId:
          type: string
        mode:
          type: string
          enum: [sequential, random, targeted, wrongBook]
        scope:
          type: object
          properties:
            categoryId:
              type: [string, 'null']
            knowledgePointId:
              type: [string, 'null']
        questionCount:
          type: integer
          enum: [10, 20, 50]

    CreateMockAttemptRequest:
      type: object
      required: [questionBankId, questionCount, durationMinutes]
      properties:
        questionBankId:
          type: string
        questionCount:
          type: integer
          enum: [10, 20, 50]
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 180

    AttemptTiming:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        remainingSeconds:
          type: integer
        observationRemainingSeconds:
          type: integer
          description: Seconds until the 20s attempt observation window ends (expiresAt + 20s)
        serverNow:
          type: string
          format: date-time

    PaperItem:
      type: object
      properties:
        itemId:
          type: string
        order:
          type: integer
        questionVersionId:
          type: string
        score:
          type: number
        type:
          $ref: '#/components/schemas/QuestionType'
        stem:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              text:
                type: string

    Paper:
      type: object
      properties:
        attemptId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaperItem'

    SaveAnswerRequest:
      type: object
      required: [answer, answerVersion]
      properties:
        answer:
          type: array
          items:
            type: string
        answerVersion:
          type: integer
          minimum: 1

    SaveStatus:
      type: string
      enum: [saving, saved, failed]

    SaveAnswerResponse:
      type: object
      properties:
        itemId:
          type: string
        confirmedVersion:
          type: integer
        saveStatus:
          $ref: '#/components/schemas/SaveStatus'
        confirmedAt:
          type: string
          format: date-time

    ExamLifecycle:
      type: string
      enum: [draft, notStarted, openForAttempt, closing, ended, cancelled]

    ExamRunStatus:
      type: string
      enum: [normal, paused]

    AttemptStatus:
      type: string
      enum: [inProgress, submitting, completed, voided, terminated]

    MockAttemptStartResponse:
      type: object
      properties:
        attemptId:
          type: string
        status:
          $ref: '#/components/schemas/AttemptStatus'
        paper:
          $ref: '#/components/schemas/Paper'
        timing:
          $ref: '#/components/schemas/AttemptTiming'

    ExamAttemptStartResponse:
      type: object
      properties:
        attemptId:
          type: string
        attemptNumber:
          type: integer
        attemptStatus:
          $ref: '#/components/schemas/AttemptStatus'
        paper:
          $ref: '#/components/schemas/Paper'
        timing:
          $ref: '#/components/schemas/AttemptTiming'

    ConfirmedAnswer:
      type: object
      properties:
        itemId:
          type: string
        answer:
          type: array
          items:
            type: string
        confirmedVersion:
          type: integer
        saveStatus:
          $ref: '#/components/schemas/SaveStatus'

    ExamAttemptDetail:
      type: object
      properties:
        attemptId:
          type: string
        examId:
          type: string
        attemptStatus:
          $ref: '#/components/schemas/AttemptStatus'
        attemptNumber:
          type: integer
        timing:
          $ref: '#/components/schemas/AttemptTiming'
        confirmedAnswers:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmedAnswer'
        runStatus:
          $ref: '#/components/schemas/ExamRunStatus'
        lifecycle:
          $ref: '#/components/schemas/ExamLifecycle'
        resultLocked:
          type: boolean
        inObservation:
          type: boolean
        observationRemainingSeconds:
          type: integer

    ResultVisibility:
      type: object
      properties:
        summaryVisible:
          type: boolean
        passingScoreVisible:
          type: boolean
        passConclusionVisible:
          type: boolean
        perItemReviewAllowed:
          type: boolean

    EmployeeAttemptResult:
      type: object
      properties:
        attemptId:
          type: string
        examId:
          type: string
        remainingAttempts:
          type: integer
        lifecycle:
          $ref: '#/components/schemas/ExamLifecycle'
        resultState:
          type: string
          enum: [available, closing, locked, cancelled]
        resultLocked:
          type: boolean
        submitted:
          type: boolean
        submittedAt:
          type: [string, 'null']
          format: date-time
        neutralMessage:
          type: [string, 'null']
        cancelNotice:
          type: [string, 'null']
        visibility:
          $ref: '#/components/schemas/ResultVisibility'
        totalScore:
          type: [number, 'null']
        maxScore:
          type: [number, 'null']
        passingScore:
          type: [number, 'null']
        retakeNeutralMessage:
          type: [string, 'null']
        items:
          type: [array, 'null']
          items:
            type: object
            properties:
              itemId:
                type: string
              isCorrect:
                type: boolean
              userAnswer:
                type: array
                items:
                  type: string
              standardAnswer:
                type: array
                items:
                  type: string
              explanation:
                type: string

    AsyncJobStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled, expired]

    ExportJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/AsyncJobStatus'
        downloadUrl:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
