name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B test

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright login smoke
        run: npm run test:e2e

  web-exam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-exam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-exam/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright login smoke
        run: npm run test:e2e

  mini-program-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert WeChat project files exist
        run: |
          test -f mini-program/project.config.json
          test -f mini-program/app.json
          test -f mini-program/app.js
          echo "GitHub Actions has no WeChat DevTools; this job only gates required files."

  load-test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert PERF scripts exist
        run: |
          test -f scripts/load-test/run-full-perf.sh
          test -f scripts/load-test/perf01-sustained.js
          test -f scripts/load-test/perf02-burst.js
          test -f scripts/load-test/perf03-expiry.js

