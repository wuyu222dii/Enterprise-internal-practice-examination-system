spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:exam_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration-h2

exam:
  security:
    session-ttl-hours: 1
  scheduler:
    auto-submit-ms: 3600000
  storage:
    backend: local
    local-path: ./target/test-storage
  sms:
    provider: mock
  retention:
    enabled: true
  outage:
    probe-enabled: false
  wechat:
    mock-openid: true

logging:
  level:
    root: WARN
    com.examsystem: INFO
