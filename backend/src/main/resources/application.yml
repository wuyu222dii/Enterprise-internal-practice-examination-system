spring:
  application:
    name: exam-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/exam_system
    username: exam
    password: exam_dev
    hikari:
      # Sized for the 500-concurrent-answering target; the default of 10 connections starves
      # request threads long before the request-latency budget in requirement 17.2 is reached.
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Assignment expansion, paper generation and batch import insert hundreds of rows per
          # transaction; without batching each row costs a round trip.
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6380
      repositories:
        enabled: false

server:
  port: 8088
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: 300
      min-spare: 30
    # 500 employees opening their paper inside the same 60-second window arrive as a connection
    # burst; the default accept queue of 100 makes the kernel reset the surplus connections.
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 20s

exam:
  security:
    session-ttl-hours: 24
    lock-duration-minutes: 15
    max-failed-attempts: 5
  storage:
    backend: ${EXAM_STORAGE_BACKEND:local}
    local-path: ./data/storage
    minio-endpoint: ${EXAM_MINIO_ENDPOINT:http://localhost:19000}
    minio-access-key: ${EXAM_MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${EXAM_MINIO_SECRET_KEY:minioadmin}
    bucket: ${EXAM_STORAGE_BUCKET:exam-files}
  sms:
    provider: ${EXAM_SMS_PROVIDER:mock}
    webhook-url: ${EXAM_SMS_WEBHOOK_URL:}
    aliyun:
      access-key-id: ${EXAM_SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${EXAM_SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${EXAM_SMS_ALIYUN_SIGN_NAME:}
      template-code: ${EXAM_SMS_ALIYUN_TEMPLATE_CODE:}
    tencent:
      secret-id: ${EXAM_SMS_TENCENT_SECRET_ID:}
      secret-key: ${EXAM_SMS_TENCENT_SECRET_KEY:}
      sdk-app-id: ${EXAM_SMS_TENCENT_SDK_APP_ID:}
      sign-name: ${EXAM_SMS_TENCENT_SIGN_NAME:}
      template-id: ${EXAM_SMS_TENCENT_TEMPLATE_ID:}
  retention:
    enabled: true
    import-confirm-days: 30
    import-file-days: 180
    export-hours: 24
    credential-hours: 24
  observation:
    window-seconds: 20
  scheduler:
    auto-submit-ms: 60000
  outage:
    probe-enabled: true
    observation-window-ms: 15000
    probe-interval-ms: 5000
    compensation-minutes: 15
  wechat:
    mock-openid: ${EXAM_WECHAT_MOCK_OPENID:true}
    app-id: ${EXAM_WECHAT_APP_ID:}
    app-secret: ${EXAM_WECHAT_APP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.examsystem: INFO
